# Render's free plan puts the app to sleep after ~15 idle minutes, and every wake-up clears what is stored on
# its disk. This pings the app every 10 minutes so it stays awake and people stay signed in.
name: keep-alive
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS -m 60 --retry 3 https://azure-devops-pr-assistant.onrender.com/api/health
