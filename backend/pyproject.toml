[project]
name = "pr-assistant-backend"
version = "0.1.0"
description = "Azure DevOps PR Assistant - local-only FastAPI backend"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "msal>=1.31",
  "pydantic>=2.8",
  "python-dotenv>=1.0",
  "claude-agent-sdk>=0.1.0",
  "pypdf>=5.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
